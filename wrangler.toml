# Gunpla Battle — Cloudflare version (Workers + Durable Objects)
name = "gunpla-battle"
main = "src/index.js"
compatibility_date = "2025-09-01"

# the app itself (index.html, images, service worker) is served straight from this folder
[assets]
directory = "./public"

# one live "room" per battle session
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "BattleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleRoom"]

[observability]
enabled = true
